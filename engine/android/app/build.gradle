plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jassim.engine'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jassim.engine'
        minSdk 26
        targetSdk 28
        versionCode 8
        versionName '0.8.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
