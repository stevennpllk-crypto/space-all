name: Request Unity 6 Personal License Activation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unity-license-request.yml"

permissions:
  contents: read

jobs:
  request-activation:
    name: Generate Unity activation request
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: activation
        uses: game-ci/unity-request-activation-file@v2
      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-6-Activation-Request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7
