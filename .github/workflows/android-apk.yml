name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Unity 6 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity license configuration
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          [[ -n "${UNITY_LICENSE//[[:space:]]/}" ]] || missing+=("UNITY_LICENSE")
          [[ -n "${UNITY_EMAIL//[[:space:]]/}" ]] || missing+=("UNITY_EMAIL")
          [[ -n "${UNITY_PASSWORD//[[:space:]]/}" ]] || missing+=("UNITY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Unity activation secrets missing::Configure these repository Actions secrets: ${missing[*]}"
            exit 1
          fi
          echo "Required Unity activation secrets are present."

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.32f1
          targetPlatform: Android
          buildMethod: GalaxyAndroidBuild.Build
          allowDirtyBuild: true

      - name: Verify APK output
        shell: bash
        run: |
          test -s Build/Android/GalaxyExplorer.apk
          file Build/Android/GalaxyExplorer.apk
          sha256sum Build/Android/GalaxyExplorer.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Explorer-Android-APK
          path: Build/Android/GalaxyExplorer.apk
          if-no-files-found: error
          retention-days: 14
