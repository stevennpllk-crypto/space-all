name: JASSIM ENGINE checks
on:
  push:
    branches: ["engine/**"]
    paths:
      - "jassim-engine/**"
      - ".github/workflows/jassim-engine-core.yml"
      - ".github/workflows/jassim-engine-android.yml"
  pull_request:
    paths:
      - "jassim-engine/**"
      - ".github/workflows/jassim-engine-core.yml"
      - ".github/workflows/jassim-engine-android.yml"
jobs:
  native-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S jassim-engine -B jassim-engine/build -DJASSIM_ENGINE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build jassim-engine/build --parallel 2
      - name: Test
        run: ctest --test-dir jassim-engine/build --output-on-failure
