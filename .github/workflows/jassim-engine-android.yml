name: JASSIM ENGINE Android build and visual test
on:
  push:
    branches: ["engine/**"]
    paths:
      - "jassim-engine/android/**"
      - "jassim-engine/include/**"
      - "jassim-engine/src/**"
      - "jassim-engine/CMakeLists.txt"
      - ".github/workflows/jassim-engine-android.yml"
  pull_request:
    paths:
      - "jassim-engine/android/**"
      - "jassim-engine/include/**"
      - "jassim-engine/src/**"
      - "jassim-engine/CMakeLists.txt"
      - ".github/workflows/jassim-engine-android.yml"
jobs:
  assemble-debug-and-visual-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build debug APK
        working-directory: jassim-engine/android
        run: gradle --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Launch emulator and capture app screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -e
            mkdir -p "$GITHUB_WORKSPACE/visual-output"
            adb devices
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            test "$(adb get-state)" = "device"
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 8
            adb install -r jassim-engine/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.jassim.engine || true
            adb shell am start -n com.jassim.engine/.MainActivity
            sleep 15
            adb shell pidof com.jassim.engine > "$GITHUB_WORKSPACE/visual-output/app-pid.txt"
            adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/visual-output/activity.txt"
            grep -q "com.jassim.engine/.MainActivity" "$GITHUB_WORKSPACE/visual-output/activity.txt"
            adb shell dumpsys gfxinfo com.jassim.engine framestats > "$GITHUB_WORKSPACE/visual-output/gfxinfo.txt"
            adb shell dumpsys meminfo com.jassim.engine > "$GITHUB_WORKSPACE/visual-output/meminfo.txt"
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/visual-output/jassim-engine-screen.png"
            adb logcat -d -t 5000 > "$GITHUB_WORKSPACE/visual-output/logcat.txt"
            test -s "$GITHUB_WORKSPACE/visual-output/jassim-engine-screen.png"
      - name: Upload APK and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jassim-engine-apk-and-visual-evidence
          path: |
            jassim-engine/android/app/build/outputs/apk/debug/app-debug.apk
            visual-output/
          if-no-files-found: warn
