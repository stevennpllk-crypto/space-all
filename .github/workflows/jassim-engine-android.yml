name: JASSIM ENGINE Android build
on:
  push:
    branches: ["engine/**"]
    paths:
      - "jassim-engine/android/**"
      - "jassim-engine/include/**"
      - "jassim-engine/src/**"
      - "jassim-engine/CMakeLists.txt"
      - ".github/workflows/jassim-engine-android.yml"
  pull_request:
    paths:
      - "jassim-engine/android/**"
      - "jassim-engine/include/**"
      - "jassim-engine/src/**"
      - "jassim-engine/CMakeLists.txt"
      - ".github/workflows/jassim-engine-android.yml"
jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build debug APK
        working-directory: jassim-engine/android
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jassim-engine-debug-apk
          path: jassim-engine/android/app/build/outputs/apk/debug/app-debug.apk
