name: JASSIM Engine Android APK

on:
  push:
    branches: [jassim-engine-foundation]
    paths:
      - "engine/**"
      - ".github/workflows/jassim-engine-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools;platforms;android-35;build-tools;35.0.0;cmake;3.22.1;ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p engine/android --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jassim-engine-debug-arm64
          path: engine/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
