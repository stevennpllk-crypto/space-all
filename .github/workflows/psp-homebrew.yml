name: Build Solar Explorer PSP Homebrew

on:
  workflow_dispatch:
  push:
    branches: [main, master, "feature/ppsspp-homebrew"]
    paths:
      - "PSPHomebrew/**"
      - ".github/workflows/psp-homebrew.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile PSP executable
        working-directory: PSPHomebrew
        run: |
          make clean || true
          make
          test -s EBOOT.PBP
          file EBOOT.PBP
      - name: Prepare PPSSPP folder
        run: |
          mkdir -p build/PSP/GAME/SOLAR_EXPLORER
          cp PSPHomebrew/EBOOT.PBP build/PSP/GAME/SOLAR_EXPLORER/EBOOT.PBP
          cd build
          zip -r SOLAR_EXPLORER_PPSSPP.zip PSP
          test -s SOLAR_EXPLORER_PPSSPP.zip
      - name: Upload EBOOT and PPSSPP package
        uses: actions/upload-artifact@v4
        with:
          name: SOLAR-EXPLORER-PPSSPP
          path: |
            PSPHomebrew/EBOOT.PBP
            build/SOLAR_EXPLORER_PPSSPP.zip
          if-no-files-found: error
